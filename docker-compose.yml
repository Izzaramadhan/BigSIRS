services:
  mysql:
    image: mysql:8.4
    container_name: bigsirs-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    env_file:
      - .env.docker
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backups:/backups
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    image: bigsirs-backend-dev:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    working_dir: /var/www/html
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://127.0.0.1:8000

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}

      LEGACY_DB_CONNECTION: mysql
      LEGACY_DB_HOST: mysql
      LEGACY_DB_PORT: 3306
      LEGACY_DB_DATABASE: simrs_legacy_restored
      LEGACY_DB_USERNAME: root
      LEGACY_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    image: bigsirs-frontend-dev:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:8000/api/v1
      VITE_USE_DASHBOARD_MOCK: "true"
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      backend:
        condition: service_started

volumes:
  mysql_data:
    external: true
    name: ${MYSQL_VOLUME_NAME}

  backend_vendor:
    name: bigsirs_backend_vendor

  frontend_node_modules:
    name: bigsirs_frontend_node_modules
